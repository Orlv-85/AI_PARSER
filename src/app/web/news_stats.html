<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>News Stats</title>
    <link rel="stylesheet" href="/static/css/news_stats.css">
  </head>
  <body>
    <main>
      <section class="panel">
        <div class="hero-nav">
          <a href="/__DAILY_DIGEST_QUERY__">Back to Daily Digest</a>
          <div class="hero-links">
            <a href="/weekly">Weekly</a>
          </div>
        </div>
        <h1>News Stats</h1>
        <p class="muted">Daily publication and fetch volume for production diagnostics.</p>
        <form id="stats-form" class="filters">
          <div>
            <label for="date-from">From</label>
            <input id="date-from" type="date" value="__DATE_FROM__" />
          </div>
          <div>
            <label for="date-to">To</label>
            <input id="date-to" type="date" value="__DATE_TO__" />
          </div>
          <button type="submit">Refresh</button>
        </form>
      </section>

      <section class="panel">
        <div id="summary" class="summary-grid"></div>
      </section>

      <section class="panel">
        <h2>Published Articles By Date</h2>
        <div id="chart" class="chart"></div>
        <p id="empty-chart" class="muted hidden">No daily stats are available for this range.</p>
      </section>

      <section class="panel">
        <h2>Daily Detail</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Published</th>
                <th>Discovered</th>
                <th>Fetch Runs</th>
                <th>Fetched</th>
                <th>New</th>
                <th>Duplicates</th>
                <th>Errors</th>
              </tr>
            </thead>
            <tbody id="stats-table"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="/static/js/news_stats.js"></script>
  </body>
</html>
