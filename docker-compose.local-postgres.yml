services:
  db:
    image: postgres:18-alpine
    container_name: ai-news-db-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ainews}
      POSTGRES_USER: ${POSTGRES_USER:-ainews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - pgdata_local:/var/lib/postgresql

  ai-news:
    build:
      context: .
      dockerfile: build/Dockerfile
    container_name: ai-news-local-pg
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AINEWS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ainews}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-ainews}
      AINEWS_SOURCES_PATH: /app/sources.yaml
      AINEWS_CONCURRENCY_LIMIT: ${AINEWS_CONCURRENCY_LIMIT:-8}
      AINEWS_REQUEST_TIMEOUT_SECONDS: ${AINEWS_REQUEST_TIMEOUT_SECONDS:-15}
      AINEWS_MAX_RETRIES: ${AINEWS_MAX_RETRIES:-3}
      AINEWS_PER_SOURCE_MIN_INTERVAL_SECONDS: ${AINEWS_PER_SOURCE_MIN_INTERVAL_SECONDS:-1.0}
    ports:
      - "8010:8010"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./data:/app/data
      - ./sources.yaml:/app/sources.yaml:ro

volumes:
  pgdata_local:
