name: db-maintenance

on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Validate deploy config
        run: |
          test -n "${{ vars.DEPLOY_HOST }}"
          test -n "${{ vars.DEPLOY_USER }}"
          test -n "${{ secrets.SERVER_SSH_KEY }}"
          test -n "${{ secrets.SERVER_KNOWN_HOSTS }}"

      - name: Install age, rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y age rclone

      - name: Configure SSH key and pinned host key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${SERVER_SSH_KEY}" > ~/.ssh/deploy_key
          printf '%s\n' "${SERVER_KNOWN_HOSTS}" > ~/.ssh/known_hosts

      - name: Run maintenance and backup
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/opt/ai-news' }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS || '800' }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "cd '${DEPLOY_APP_DIR}' && RETENTION_DAYS='${RETENTION_DAYS}' ./scripts/db_maintenance.sh && ./scripts/db_backup.sh"

      - name: Upload backup off-site
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/opt/ai-news' }}
          OFFSITE_B2_BUCKET: ${{ vars.OFFSITE_B2_BUCKET }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          OFFSITE_B2_KEY_ID: ${{ secrets.OFFSITE_B2_KEY_ID }}
          OFFSITE_B2_APPLICATION_KEY: ${{ secrets.OFFSITE_B2_APPLICATION_KEY }}
        # Runs after the server backup, so missing off-site config never skips the backup itself.
        run: |
          test -n "${OFFSITE_B2_BUCKET}" && test -n "${BACKUP_AGE_RECIPIENT}"
          test -n "${OFFSITE_B2_KEY_ID}" && test -n "${OFFSITE_B2_APPLICATION_KEY}"
          remote_file="$(ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "ls -1t '${DEPLOY_APP_DIR}'/backups/postgres_*.sql.gz | head -n 1")"
          test -n "${remote_file}"
          scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_file}" "${RUNNER_TEMP}/"
          ./scripts/db_offsite_upload.sh "${RUNNER_TEMP}/$(basename "${remote_file}")"
          rm -f "${RUNNER_TEMP}"/postgres_*.sql.gz
