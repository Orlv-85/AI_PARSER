name: tests

on:
  push:
    branches:
      - "**"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            build/requirements.txt
            build/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r build/requirements-dev.txt
          pip install --no-deps -e .

      - name: Run linters in parallel
        run: make -j3 --output-sync=target lint PYTHON=python

  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ainews_test
          POSTGRES_PASSWORD: isolated_ci_test
          POSTGRES_DB: ainews_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ainews_test -d ainews_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build test image (Python 3.14)
        run: docker build -f build/Dockerfile --target test --build-arg PYTHON_IMAGE=python:3.14-slim -t ai-news-test:${{ github.sha }} .

      - name: Run tests in Docker with coverage
        run: >-
          docker run --rm --network host
          -e AINEWS_COVERAGE_FAIL_UNDER=90
          -e AINEWS_TEST_POSTGRES_URL=postgresql+psycopg://ainews_test:isolated_ci_test@127.0.0.1:5432/ainews_test
          ai-news-test:${{ github.sha }}
