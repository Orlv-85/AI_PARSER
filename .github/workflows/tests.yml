name: tests

on:
  push:
    branches:
      - "**"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            build/requirements.txt
            build/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r build/requirements-dev.txt
          pip install --no-deps -e .

      - name: Cache mypy
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py3.14-${{ hashFiles('build/requirements-dev.txt', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.14-${{ hashFiles('build/requirements-dev.txt', 'pyproject.toml') }}-

      - name: Run linters in parallel
        run: make -j3 --output-sync=target lint PYTHON=python PYLINT_JOBS=0

      # Warn-only for now: covered code changed without its doc (scripts/check_code_docs.py).
      - name: Code docs in sync
        run: python scripts/check_code_docs.py --diff origin/master

  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ainews_test
          POSTGRES_PASSWORD: isolated_ci_test
          POSTGRES_DB: ainews_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ainews_test -d ainews_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            build/requirements.txt
            build/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r build/requirements-dev.txt
          pip install --no-deps -e .

      - name: Run tests with coverage
        env:
          AINEWS_COVERAGE_FAIL_UNDER: "90"
          AINEWS_TEST_POSTGRES_URL: postgresql+psycopg://ainews_test:isolated_ci_test@127.0.0.1:5432/ainews_test
        run: ./scripts/run_tests_with_coverage.sh
