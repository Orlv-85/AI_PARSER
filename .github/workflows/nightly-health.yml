name: nightly-health

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Configure SSH key and pinned host key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${SERVER_SSH_KEY}" > ~/.ssh/deploy_key
          printf '%s\n' "${SERVER_KNOWN_HOSTS}" > ~/.ssh/known_hosts

      - name: Check nightly jobs over SSH
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/opt/ai-news' }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_APP_DIR='${DEPLOY_APP_DIR}' bash -s" <<'REMOTE'
          set +e
          cd "$DEPLOY_APP_DIR" || exit 1
          failed=0
          today="$(date -u +%F)"
          yesterday="$(date -u -d yesterday +%F)"

          collection_status="$(docker exec ai-news-app python -c '
          from app.storage.db import SessionLocal
          from app.storage.admission import read_collection_status
          session = SessionLocal()
          try:
              paused, _ = read_collection_status(session)
              print("paused" if paused else "active")
          finally:
              session.close()
          ' 2>/dev/null)"
          if [ "$?" -eq 0 ] && [ "$collection_status" = "active" ]; then
            echo "collection_not_paused: ok"
          else
            echo "collection_not_paused: failed"
            failed=1
          fi

          if grep -F "$today" logs/daily-fetch.log 2>/dev/null | \
            grep -F "fetch_run_finished" >/dev/null; then
            echo "today_fetch_finished: ok"
          else
            echo "today_fetch_finished: failed"
            failed=1
          fi

          digest_status="$(docker exec ai-news-app cat "data/daily-enrichment/$yesterday/report.json" 2>/dev/null | MIN_DIGEST_SCOPE=5 python3 -c '
          import json
          import os
          import sys
          try:
              report = json.load(sys.stdin)
              ok = (isinstance(report, dict)
                    and str(report.get("state", "")).startswith("published")
                    and int(report.get("scope_count", -1)) >= int(os.environ["MIN_DIGEST_SCOPE"]))
          except (OSError, ValueError, TypeError):
              ok = False
          print("ok" if ok else "failed")
          ' 2>/dev/null)"
          if [ "$?" -eq 0 ] && [ "$digest_status" = "ok" ]; then
            echo "yesterday_digest_published_with_scope: ok"
          else
            echo "yesterday_digest_published_with_scope: failed"
            failed=1
          fi

          # The digest job logs one JSON report per daily-signals run; a stop on a paid cap,
          # deadline or provider error, or a skipped brief, means work of that day was not done.
          signals_line="$(grep -F "\"report_date\": \"$yesterday\"" logs/daily-digest.log 2>/dev/null | \
            grep -F '"extraction_version"' | tail -n 1)"
          signals_status="$(printf '%s' "$signals_line" | REPORT_DATE="$yesterday" python3 -c '
          import json
          import os
          import sys
          try:
              report = json.loads(sys.stdin.read())
              brief = report.get("brief") or {}
              day = str((brief.get("days") or {}).get(os.environ["REPORT_DATE"], ""))
              ok = report.get("state") == "ok" and not day.startswith("skipped:")
          except (ValueError, TypeError, AttributeError):
              ok = False
          print("ok" if ok else "failed")
          ' 2>/dev/null)"
          if [ "$?" -eq 0 ] && [ "$signals_status" = "ok" ]; then
            echo "yesterday_signals_within_limits: ok"
          else
            echo "yesterday_signals_within_limits: failed"
            failed=1
          fi

          exit "$failed"
          REMOTE
