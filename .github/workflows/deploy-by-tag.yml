name: deploy-by-tag

on:
  workflow_dispatch:
    inputs:
      deploy_tag:
        description: "Git tag to deploy (for release or rollback)"
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy config
        run: |
          test -n "${{ github.event.inputs.deploy_tag }}"
          test -n "${{ vars.DEPLOY_HOST }}"
          test -n "${{ vars.DEPLOY_USER }}"
          test -n "${{ secrets.SERVER_PASSWORD }}"
          test -n "${{ secrets.GHCR_TOKEN }}"
          test -n "${{ secrets.AINEWS_AUTH_PASSWORD_HASH }}"
          test -n "${{ secrets.AINEWS_AUTH_SECRET }}"

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          for i in 1 2 3; do
            ssh-keyscan -T 5 -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts && break
            sleep 2
          done

      - name: Prepare runtime env payload
        env:
          AINEWS_AUTH_PASSWORD_HASH: ${{ secrets.AINEWS_AUTH_PASSWORD_HASH }}
          AINEWS_AUTH_SECRET: ${{ secrets.AINEWS_AUTH_SECRET }}
          AINEWS_AUTH_USERNAME: ${{ vars.AINEWS_AUTH_USERNAME || 'operator' }}
          AINEWS_AUTH_ENABLED: ${{ vars.AINEWS_AUTH_ENABLED || 'true' }}
          AINEWS_AUTH_SESSION_TTL_SECONDS: ${{ vars.AINEWS_AUTH_SESSION_TTL_SECONDS || '3600' }}
          AINEWS_AUTH_COOKIE_SECURE: ${{ vars.AINEWS_AUTH_COOKIE_SECURE || 'true' }}
          AINEWS_MCP_AUTH_ENABLED: ${{ vars.AINEWS_MCP_AUTH_ENABLED || 'false' }}
          AINEWS_MCP_AUTH_TOKEN: ${{ secrets.AINEWS_MCP_AUTH_TOKEN }}
          ANTIGRAVITY_ENABLED: ${{ vars.ANTIGRAVITY_ENABLED || 'true' }}
          ANTIGRAVITY_IMAGE: ${{ vars.ANTIGRAVITY_IMAGE || 'lbjlaq/antigravity-manager:latest' }}
          ANTIGRAVITY_PORT: ${{ vars.ANTIGRAVITY_PORT || '8045' }}
          ANTIGRAVITY_WEB_PASSWORD: ${{ secrets.ANTIGRAVITY_WEB_PASSWORD }}
          ANTIGRAVITY_ACCOUNT_EMAIL: ${{ secrets.ANTIGRAVITY_ACCOUNT_EMAIL }}
          ANTIGRAVITY_ACCOUNT_PASSWORD: ${{ secrets.ANTIGRAVITY_ACCOUNT_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          AINEWS_AUTH_PASSWORD_HASH_ESCAPED="$(printf '%s' "${AINEWS_AUTH_PASSWORD_HASH}" | sed 's/[$]/$$/g')"
          AINEWS_AUTH_SECRET_ESCAPED="$(printf '%s' "${AINEWS_AUTH_SECRET}" | sed 's/[$]/$$/g')"
          AINEWS_MCP_AUTH_TOKEN_ESCAPED="$(printf '%s' "${AINEWS_MCP_AUTH_TOKEN}" | sed 's/[$]/$$/g')"
          ANTIGRAVITY_WEB_PASSWORD_ESCAPED="$(printf '%s' "${ANTIGRAVITY_WEB_PASSWORD:-change_me}" | sed 's/[$]/$$/g')"
          ANTIGRAVITY_ACCOUNT_EMAIL_ESCAPED="$(printf '%s' "${ANTIGRAVITY_ACCOUNT_EMAIL}" | sed 's/[$]/$$/g')"
          ANTIGRAVITY_ACCOUNT_PASSWORD_ESCAPED="$(printf '%s' "${ANTIGRAVITY_ACCOUNT_PASSWORD}" | sed 's/[$]/$$/g')"
          ANTHROPIC_API_KEY_ESCAPED="$(printf '%s' "${ANTHROPIC_API_KEY}" | sed 's/[$]/$$/g')"
          {
            printf 'AINEWS_AUTH_ENABLED=%s\n' "${AINEWS_AUTH_ENABLED}"
            printf 'AINEWS_AUTH_USERNAME=%s\n' "${AINEWS_AUTH_USERNAME}"
            printf 'AINEWS_AUTH_PASSWORD_HASH=%s\n' "${AINEWS_AUTH_PASSWORD_HASH_ESCAPED}"
            printf 'AINEWS_AUTH_SECRET=%s\n' "${AINEWS_AUTH_SECRET_ESCAPED}"
            printf 'AINEWS_AUTH_SESSION_TTL_SECONDS=%s\n' "${AINEWS_AUTH_SESSION_TTL_SECONDS}"
            printf 'AINEWS_AUTH_COOKIE_SECURE=%s\n' "${AINEWS_AUTH_COOKIE_SECURE}"
            printf 'AINEWS_MCP_AUTH_ENABLED=%s\n' "${AINEWS_MCP_AUTH_ENABLED}"
            printf 'AINEWS_MCP_AUTH_TOKEN=%s\n' "${AINEWS_MCP_AUTH_TOKEN_ESCAPED}"
            printf 'ANTIGRAVITY_ENABLED=%s\n' "${ANTIGRAVITY_ENABLED}"
            printf 'ANTIGRAVITY_IMAGE=%s\n' "${ANTIGRAVITY_IMAGE}"
            printf 'ANTIGRAVITY_PORT=%s\n' "${ANTIGRAVITY_PORT}"
            printf 'ANTIGRAVITY_WEB_PASSWORD=%s\n' "${ANTIGRAVITY_WEB_PASSWORD_ESCAPED}"
            printf 'ANTIGRAVITY_ACCOUNT_EMAIL=%s\n' "${ANTIGRAVITY_ACCOUNT_EMAIL_ESCAPED}"
            printf 'ANTIGRAVITY_ACCOUNT_PASSWORD=%s\n' "${ANTIGRAVITY_ACCOUNT_PASSWORD_ESCAPED}"
            printf 'ANTHROPIC_API_KEY=%s\n' "${ANTHROPIC_API_KEY_ESCAPED}"
          } > /tmp/ai_news_auth.env

      - name: Prepare GHCR token payload
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" > /tmp/ai_news_ghcr.token

      - name: Deploy selected tag
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/opt/ai-news' }}
          DEPLOY_TAG: ${{ github.event.inputs.deploy_tag }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -p "${SERVER_PASSWORD}" scp -o StrictHostKeyChecking=accept-new /tmp/ai_news_auth.env "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/ai_news_auth.env"
          sshpass -p "${SERVER_PASSWORD}" scp -o StrictHostKeyChecking=accept-new /tmp/ai_news_ghcr.token "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/ai_news_ghcr.token"
          sshpass -p "${SERVER_PASSWORD}" ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" "cd '${DEPLOY_APP_DIR}' && git fetch --force origin '+refs/tags/*:refs/tags/*' && git rev-parse --verify --quiet 'refs/tags/${DEPLOY_TAG}' >/dev/null || { echo 'Tag not found: ${DEPLOY_TAG}' >&2; exit 1; } && touch .env && grep -vE '^(AINEWS_AUTH_ENABLED|AINEWS_AUTH_USERNAME|AINEWS_AUTH_PASSWORD_HASH|AINEWS_AUTH_SECRET|AINEWS_AUTH_SESSION_TTL_SECONDS|AINEWS_AUTH_COOKIE_SECURE|AINEWS_MCP_AUTH_ENABLED|AINEWS_MCP_AUTH_TOKEN|ANTIGRAVITY_ENABLED|ANTIGRAVITY_IMAGE|ANTIGRAVITY_PORT|ANTIGRAVITY_WEB_PASSWORD|ANTIGRAVITY_ACCOUNT_EMAIL|ANTIGRAVITY_ACCOUNT_PASSWORD|ANTHROPIC_API_KEY)=' .env > .env.next || true && cat /tmp/ai_news_auth.env >> .env.next && mv .env.next .env && rm -f /tmp/ai_news_auth.env && cat /tmp/ai_news_ghcr.token | docker login ghcr.io -u 'orlv-85' --password-stdin && rm -f /tmp/ai_news_ghcr.token && git checkout --force '${DEPLOY_TAG}' && APP_IMAGE='ghcr.io/orlv-85/ai-parser:${DEPLOY_TAG}' ./scripts/deploy_prod.sh '${DEPLOY_TAG}'"
