name: deploy-release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image (Python 3.14)
        run: docker build -f build/Dockerfile --target test --build-arg PYTHON_IMAGE=python:3.14-slim -t ai-news-test:${{ github.sha }} .

      - name: Run linters in Docker test image
        run: docker run --rm ai-news-test:${{ github.sha }} make lint PYTHON=python

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image (Python 3.14)
        run: docker build -f build/Dockerfile --target test --build-arg PYTHON_IMAGE=python:3.14-slim -t ai-news-test:${{ github.sha }} .

      - name: Run tests in Docker with coverage
        run: docker run --rm -e AINEWS_COVERAGE_FAIL_UNDER=90 ai-news-test:${{ github.sha }}

  build-image:
    needs:
      - lint
      - tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/orlv-85/ai-parser:${{ github.ref_name }}
            ghcr.io/orlv-85/ai-parser:sha-${{ github.sha }}
            ghcr.io/orlv-85/ai-parser:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy config
        run: |
          test -n "${{ vars.DEPLOY_HOST }}"
          test -n "${{ vars.DEPLOY_USER }}"
          test -n "${{ secrets.SERVER_PASSWORD }}"
          test -n "${{ secrets.GHCR_TOKEN }}"
          test -n "${{ secrets.AINEWS_AUTH_PASSWORD_HASH }}"
          test -n "${{ secrets.AINEWS_AUTH_SECRET }}"

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          for i in 1 2 3; do
            ssh-keyscan -T 5 -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts && break
            sleep 2
          done

      - name: Prepare runtime env payload
        env:
          AINEWS_AUTH_PASSWORD_HASH: ${{ secrets.AINEWS_AUTH_PASSWORD_HASH }}
          AINEWS_AUTH_SECRET: ${{ secrets.AINEWS_AUTH_SECRET }}
          AINEWS_AUTH_USERNAME: ${{ vars.AINEWS_AUTH_USERNAME || 'operator' }}
          AINEWS_AUTH_ENABLED: ${{ vars.AINEWS_AUTH_ENABLED || 'true' }}
          AINEWS_AUTH_SESSION_TTL_SECONDS: ${{ vars.AINEWS_AUTH_SESSION_TTL_SECONDS || '3600' }}
          AINEWS_AUTH_COOKIE_SECURE: ${{ vars.AINEWS_AUTH_COOKIE_SECURE || 'true' }}
          AINEWS_MCP_AUTH_ENABLED: ${{ vars.AINEWS_MCP_AUTH_ENABLED || 'false' }}
          AINEWS_MCP_AUTH_TOKEN: ${{ secrets.AINEWS_MCP_AUTH_TOKEN }}
          ANTIGRAVITY_ENABLED: ${{ vars.ANTIGRAVITY_ENABLED || 'true' }}
          ANTIGRAVITY_IMAGE: ${{ vars.ANTIGRAVITY_IMAGE || 'lbjlaq/antigravity-manager:latest' }}
          ANTIGRAVITY_PORT: ${{ vars.ANTIGRAVITY_PORT || '8045' }}
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
          ANTIGRAVITY_WEB_PASSWORD: ${{ secrets.ANTIGRAVITY_WEB_PASSWORD }}
          ANTIGRAVITY_ACCOUNT_EMAIL: ${{ secrets.ANTIGRAVITY_ACCOUNT_EMAIL }}
          ANTIGRAVITY_ACCOUNT_PASSWORD: ${{ secrets.ANTIGRAVITY_ACCOUNT_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          AINEWS_AUTH_PASSWORD_HASH_ESCAPED="$(printf '%s' "${AINEWS_AUTH_PASSWORD_HASH}" | sed 's/[$]/$$/g')"
          AINEWS_AUTH_SECRET_ESCAPED="$(printf '%s' "${AINEWS_AUTH_SECRET}" | sed 's/[$]/$$/g')"
          AINEWS_MCP_AUTH_TOKEN_ESCAPED="$(printf '%s' "${AINEWS_MCP_AUTH_TOKEN}" | sed 's/[$]/$$/g')"
          ANTIGRAVITY_API_KEY_ESCAPED="$(printf '%s' "${ANTIGRAVITY_API_KEY:-change_me}" | sed 's/[$]/$$/g')"
          ANTIGRAVITY_WEB_PASSWORD_ESCAPED="$(printf '%s' "${ANTIGRAVITY_WEB_PASSWORD:-change_me}" | sed 's/[$]/$$/g')"
          ANTIGRAVITY_ACCOUNT_EMAIL_ESCAPED="$(printf '%s' "${ANTIGRAVITY_ACCOUNT_EMAIL}" | sed 's/[$]/$$/g')"
          ANTIGRAVITY_ACCOUNT_PASSWORD_ESCAPED="$(printf '%s' "${ANTIGRAVITY_ACCOUNT_PASSWORD}" | sed 's/[$]/$$/g')"
          ANTHROPIC_API_KEY_ESCAPED="$(printf '%s' "${ANTHROPIC_API_KEY}" | sed 's/[$]/$$/g')"
          {
            printf 'AINEWS_AUTH_ENABLED=%s\n' "${AINEWS_AUTH_ENABLED}"
            printf 'AINEWS_AUTH_USERNAME=%s\n' "${AINEWS_AUTH_USERNAME}"
            printf 'AINEWS_AUTH_PASSWORD_HASH=%s\n' "${AINEWS_AUTH_PASSWORD_HASH_ESCAPED}"
            printf 'AINEWS_AUTH_SECRET=%s\n' "${AINEWS_AUTH_SECRET_ESCAPED}"
            printf 'AINEWS_AUTH_SESSION_TTL_SECONDS=%s\n' "${AINEWS_AUTH_SESSION_TTL_SECONDS}"
            printf 'AINEWS_AUTH_COOKIE_SECURE=%s\n' "${AINEWS_AUTH_COOKIE_SECURE}"
            printf 'AINEWS_MCP_AUTH_ENABLED=%s\n' "${AINEWS_MCP_AUTH_ENABLED}"
            printf 'AINEWS_MCP_AUTH_TOKEN=%s\n' "${AINEWS_MCP_AUTH_TOKEN_ESCAPED}"
            printf 'ANTIGRAVITY_ENABLED=%s\n' "${ANTIGRAVITY_ENABLED}"
            printf 'ANTIGRAVITY_IMAGE=%s\n' "${ANTIGRAVITY_IMAGE}"
            printf 'ANTIGRAVITY_PORT=%s\n' "${ANTIGRAVITY_PORT}"
            printf 'ANTIGRAVITY_API_KEY=%s\n' "${ANTIGRAVITY_API_KEY_ESCAPED}"
            printf 'ANTIGRAVITY_WEB_PASSWORD=%s\n' "${ANTIGRAVITY_WEB_PASSWORD_ESCAPED}"
            printf 'ANTIGRAVITY_ACCOUNT_EMAIL=%s\n' "${ANTIGRAVITY_ACCOUNT_EMAIL_ESCAPED}"
            printf 'ANTIGRAVITY_ACCOUNT_PASSWORD=%s\n' "${ANTIGRAVITY_ACCOUNT_PASSWORD_ESCAPED}"
            printf 'ANTHROPIC_API_KEY=%s\n' "${ANTHROPIC_API_KEY_ESCAPED}"
          } > /tmp/ai_news_auth.env

      - name: Prepare GHCR token payload
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" > /tmp/ai_news_ghcr.token

      - name: Deploy tagged release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/opt/ai-news' }}
          DEPLOY_TAG: ${{ github.ref_name }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -p "${SERVER_PASSWORD}" scp -o StrictHostKeyChecking=accept-new /tmp/ai_news_auth.env "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/ai_news_auth.env"
          sshpass -p "${SERVER_PASSWORD}" scp -o StrictHostKeyChecking=accept-new /tmp/ai_news_ghcr.token "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/ai_news_ghcr.token"
          sshpass -p "${SERVER_PASSWORD}" ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" "cd '${DEPLOY_APP_DIR}' && touch .env && grep -vE '^(AINEWS_AUTH_ENABLED|AINEWS_AUTH_USERNAME|AINEWS_AUTH_PASSWORD_HASH|AINEWS_AUTH_SECRET|AINEWS_AUTH_SESSION_TTL_SECONDS|AINEWS_AUTH_COOKIE_SECURE|AINEWS_MCP_AUTH_ENABLED|AINEWS_MCP_AUTH_TOKEN|ANTIGRAVITY_ENABLED|ANTIGRAVITY_IMAGE|ANTIGRAVITY_PORT|ANTIGRAVITY_API_KEY|ANTIGRAVITY_WEB_PASSWORD|ANTIGRAVITY_ACCOUNT_EMAIL|ANTIGRAVITY_ACCOUNT_PASSWORD|ANTHROPIC_API_KEY)=' .env > .env.next || true && cat /tmp/ai_news_auth.env >> .env.next && mv .env.next .env && rm -f /tmp/ai_news_auth.env && cat /tmp/ai_news_ghcr.token | docker login ghcr.io -u 'orlv-85' --password-stdin && rm -f /tmp/ai_news_ghcr.token && git fetch --force origin '+refs/tags/*:refs/tags/*' && git checkout --force '${DEPLOY_TAG}' && APP_IMAGE='ghcr.io/orlv-85/ai-parser:${DEPLOY_TAG}' ./scripts/deploy_prod.sh '${DEPLOY_TAG}'"

  cleanup-ghcr:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Delete old GHCR image versions (keep 5)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate --slurp /users/orlv-85/packages/container/ai-parser/versions > /tmp/ghcr_versions.json
          python3 - <<'PY'
          import json
          import subprocess
          from datetime import datetime

          with open("/tmp/ghcr_versions.json", "r", encoding="utf-8") as fh:
              pages = json.load(fh)

          versions = []
          for page in pages:
              versions.extend(page)

          tagged = []
          for version in versions:
              tags = (((version.get("metadata") or {}).get("container") or {}).get("tags") or [])
              if tags:
                  tagged.append(version)

          def _created(v):
              return datetime.fromisoformat(v["created_at"].replace("Z", "+00:00"))

          tagged.sort(key=_created, reverse=True)
          keep = 5
          to_delete = tagged[keep:]
          print(f"Found {len(tagged)} tagged versions, keeping {min(keep, len(tagged))}, deleting {len(to_delete)}")

          for version in to_delete:
              version_id = version["id"]
              tags = (((version.get("metadata") or {}).get("container") or {}).get("tags") or [])
              print(f"Deleting version_id={version_id} tags={tags}")
              subprocess.run(
                  [
                      "gh",
                      "api",
                      "--method",
                      "DELETE",
                      f"/users/orlv-85/packages/container/ai-parser/versions/{version_id}",
                  ],
                  check=True,
              )
          PY
