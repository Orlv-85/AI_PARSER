name: deploy-release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build test image (Python 3.14)
        run: docker build -f build/Dockerfile --target test --build-arg PYTHON_IMAGE=python:3.14-slim -t ai-news-test:${{ github.sha }} .

      - name: Run linters in Docker test image
        run: docker run --rm ai-news-test:${{ github.sha }} make lint PYTHON=python

  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build test image (Python 3.14)
        run: docker build -f build/Dockerfile --target test --build-arg PYTHON_IMAGE=python:3.14-slim -t ai-news-test:${{ github.sha }} .

      - name: Run tests in Docker with coverage
        run: docker run --rm -e AINEWS_COVERAGE_FAIL_UNDER=90 ai-news-test:${{ github.sha }}

  build-image:
    needs:
      - lint
      - tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute dependency base image
        id: deps
        run: |
          DEP_HASH="$(./scripts/docker_dependency_fingerprint.sh)"
          BASE_IMAGE="ghcr.io/orlv-85/ai-parser:runtime-base-${DEP_HASH}"
          echo "hash=${DEP_HASH}" >> "$GITHUB_OUTPUT"
          echo "base_image=${BASE_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Dependency base image: ${BASE_IMAGE}"

      - name: Check dependency base image
        id: base
        run: |
          if docker buildx imagetools inspect "${{ steps.deps.outputs.base_image }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Using existing dependency base image"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Dependency base image is missing and will be built"
          fi

      - name: Build and push dependency base image
        if: steps.base.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile
          target: runtime-base
          push: true
          tags: ${{ steps.deps.outputs.base_image }}
          build-args: |
            PYTHON_IMAGE=python:3.14-slim
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile.runtime
          push: true
          tags: |
            ghcr.io/orlv-85/ai-parser:${{ github.ref_name }}
            ghcr.io/orlv-85/ai-parser:sha-${{ github.sha }}
            ghcr.io/orlv-85/ai-parser:latest
          build-args: |
            RUNTIME_BASE_IMAGE=${{ steps.deps.outputs.base_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-image
    runs-on: ubuntu-24.04
    steps:
      - name: Validate deploy config
        env:
          DS_API_KEY: ${{ secrets.DS_API_KEY }}
        run: |
          test -n "${DS_API_KEY}" || { echo 'DS_API_KEY repository secret is required'; exit 1; }
          test -n "${{ vars.DEPLOY_HOST }}"
          test -n "${{ vars.DEPLOY_USER }}"
          test -n "${{ secrets.SERVER_PASSWORD }}"
          test -n "${{ secrets.GHCR_TOKEN }}"
          test -n "${{ secrets.AINEWS_AUTH_PASSWORD_HASH }}"
          test -n "${{ secrets.AINEWS_AUTH_SECRET }}"

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          for i in 1 2 3; do
            ssh-keyscan -T 5 -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts && break
            sleep 2
          done

      - name: Prepare runtime env payload
        env:
          DS_API_KEY: ${{ secrets.DS_API_KEY }}
          AINEWS_DIGEST_MODEL: ${{ vars.AINEWS_DIGEST_MODEL || 'deepseek-flash' }}
          AINEWS_JEV_ENABLED: "true"
          AINEWS_SEMANTIC_ADMISSION_ENABLED: "true"
          AINEWS_WEEKLY_V2_ENABLED: "false"
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS || '800' }}
          AINEWS_AUTH_PASSWORD_HASH: ${{ secrets.AINEWS_AUTH_PASSWORD_HASH }}
          AINEWS_AUTH_SECRET: ${{ secrets.AINEWS_AUTH_SECRET }}
          AINEWS_AUTH_USERNAME: ${{ vars.AINEWS_AUTH_USERNAME || 'operator' }}
          AINEWS_AUTH_ENABLED: ${{ vars.AINEWS_AUTH_ENABLED || 'true' }}
          AINEWS_AUTH_SESSION_TTL_SECONDS: ${{ vars.AINEWS_AUTH_SESSION_TTL_SECONDS || '3600' }}
          AINEWS_AUTH_COOKIE_SECURE: ${{ vars.AINEWS_AUTH_COOKIE_SECURE || 'true' }}
          AINEWS_MCP_AUTH_ENABLED: ${{ vars.AINEWS_MCP_AUTH_ENABLED || 'false' }}
          AINEWS_MCP_AUTH_TOKEN: ${{ secrets.AINEWS_MCP_AUTH_TOKEN }}
        run: |
          umask 077
          DS_API_KEY_ESCAPED="$(printf '%s' "${DS_API_KEY}" | sed 's/[$]/$$/g')"
          AINEWS_AUTH_PASSWORD_HASH_ESCAPED="$(printf '%s' "${AINEWS_AUTH_PASSWORD_HASH}" | sed 's/[$]/$$/g')"
          AINEWS_AUTH_SECRET_ESCAPED="$(printf '%s' "${AINEWS_AUTH_SECRET}" | sed 's/[$]/$$/g')"
          AINEWS_MCP_AUTH_TOKEN_ESCAPED="$(printf '%s' "${AINEWS_MCP_AUTH_TOKEN}" | sed 's/[$]/$$/g')"
          {
            printf 'DS_API_KEY=%s\n' "${DS_API_KEY_ESCAPED}"
            printf 'AINEWS_DIGEST_MODEL=%s\n' "${AINEWS_DIGEST_MODEL}"
            printf 'AINEWS_JEV_ENABLED=%s\n' "${AINEWS_JEV_ENABLED}"
            printf 'AINEWS_SEMANTIC_ADMISSION_ENABLED=%s\n' "${AINEWS_SEMANTIC_ADMISSION_ENABLED}"
            printf 'AINEWS_WEEKLY_V2_ENABLED=%s\n' "${AINEWS_WEEKLY_V2_ENABLED}"
            printf 'RETENTION_DAYS=%s\n' "${RETENTION_DAYS}"
            printf 'AINEWS_AUTH_ENABLED=%s\n' "${AINEWS_AUTH_ENABLED}"
            printf 'AINEWS_AUTH_USERNAME=%s\n' "${AINEWS_AUTH_USERNAME}"
            printf 'AINEWS_AUTH_PASSWORD_HASH=%s\n' "${AINEWS_AUTH_PASSWORD_HASH_ESCAPED}"
            printf 'AINEWS_AUTH_SECRET=%s\n' "${AINEWS_AUTH_SECRET_ESCAPED}"
            printf 'AINEWS_AUTH_SESSION_TTL_SECONDS=%s\n' "${AINEWS_AUTH_SESSION_TTL_SECONDS}"
            printf 'AINEWS_AUTH_COOKIE_SECURE=%s\n' "${AINEWS_AUTH_COOKIE_SECURE}"
            printf 'AINEWS_MCP_AUTH_ENABLED=%s\n' "${AINEWS_MCP_AUTH_ENABLED}"
            printf 'AINEWS_MCP_AUTH_TOKEN=%s\n' "${AINEWS_MCP_AUTH_TOKEN_ESCAPED}"
          } > /tmp/ai_news_auth.env

      - name: Prepare GHCR token payload
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" > /tmp/ai_news_ghcr.token

      - name: Deploy tagged release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/opt/ai-news' }}
          DEPLOY_TAG: ${{ github.ref_name }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS || '800' }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          retry() {
            local attempts=5
            local delay=5
            local i=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$i" -ge "$attempts" ]; then
                echo "Command failed after ${attempts} attempts: $*" >&2
                return 1
              fi
              echo "Attempt ${i}/${attempts} failed, retrying in ${delay}s: $*" >&2
              sleep "$delay"
              i=$((i + 1))
            done
          }
          retry sshpass -p "${SERVER_PASSWORD}" scp ${SSH_OPTS} /tmp/ai_news_auth.env "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/ai_news_auth.env"
          retry sshpass -p "${SERVER_PASSWORD}" scp ${SSH_OPTS} /tmp/ai_news_ghcr.token "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/ai_news_ghcr.token"
          retry sshpass -p "${SERVER_PASSWORD}" ssh ${SSH_OPTS} "${DEPLOY_USER}@${DEPLOY_HOST}" "cd '${DEPLOY_APP_DIR}' && touch .env && grep -vE '^(AINEWS_AUTH_ENABLED|AINEWS_AUTH_USERNAME|AINEWS_AUTH_PASSWORD_HASH|AINEWS_AUTH_SECRET|AINEWS_AUTH_SESSION_TTL_SECONDS|AINEWS_AUTH_COOKIE_SECURE|AINEWS_MCP_AUTH_ENABLED|AINEWS_MCP_AUTH_TOKEN|ANTIGRAVITY_[A-Z_]+|POCKETPAW_[A-Z_]+|ANTHROPIC_API_KEY|AINEWS_JEV_ENABLED|AINEWS_SEMANTIC_ADMISSION_ENABLED|AINEWS_WEEKLY_V2_ENABLED|DS_API_KEY|AINEWS_DIGEST_MODEL|RETENTION_DAYS)=' .env > .env.next || true && cat /tmp/ai_news_auth.env >> .env.next && chmod 600 .env.next && mv .env.next .env && cat /tmp/ai_news_ghcr.token | docker login ghcr.io -u 'orlv-85' --password-stdin && git fetch --force origin '+refs/tags/*:refs/tags/*' && git checkout --force '${DEPLOY_TAG}' && RETENTION_DAYS='${RETENTION_DAYS}' AINEWS_WEEKLY_CRON_ENABLED=0 APP_IMAGE='ghcr.io/orlv-85/ai-parser:${DEPLOY_TAG}' ./scripts/deploy_prod.sh '${DEPLOY_TAG}' && rm -f /tmp/ai_news_auth.env /tmp/ai_news_ghcr.token"

  cleanup-ghcr:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Delete old GHCR image versions (keep 5)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate --slurp /users/orlv-85/packages/container/ai-parser/versions > /tmp/ghcr_versions.json
          python3 - <<'PY'
          import json
          import subprocess
          from datetime import datetime

          with open("/tmp/ghcr_versions.json", "r", encoding="utf-8") as fh:
              pages = json.load(fh)

          versions = []
          for page in pages:
              versions.extend(page)

          release_tagged = []
          base_tagged = []
          for version in versions:
              tags = (((version.get("metadata") or {}).get("container") or {}).get("tags") or [])
              if any(tag.startswith("runtime-base-") for tag in tags):
                  base_tagged.append(version)
              elif tags:
                  release_tagged.append(version)

          def _created(v):
              return datetime.fromisoformat(v["created_at"].replace("Z", "+00:00"))

          release_tagged.sort(key=_created, reverse=True)
          keep = 5
          to_delete = release_tagged[keep:]
          print(
              f"Found {len(release_tagged)} release image versions, "
              f"keeping {min(keep, len(release_tagged))}, deleting {len(to_delete)}. "
              f"Dependency base versions kept: {len(base_tagged)}"
          )

          for version in to_delete:
              version_id = version["id"]
              tags = (((version.get("metadata") or {}).get("container") or {}).get("tags") or [])
              print(f"Deleting version_id={version_id} tags={tags}")
              subprocess.run(
                  [
                      "gh",
                      "api",
                      "--method",
                      "DELETE",
                      f"/users/orlv-85/packages/container/ai-parser/versions/{version_id}",
                  ],
                  check=True,
              )
          PY
