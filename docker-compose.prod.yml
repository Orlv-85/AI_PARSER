services:
  db:
    image: postgres:18-alpine
    container_name: ai-news-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ainews}
      POSTGRES_USER: ${POSTGRES_USER:-ainews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: ${APP_IMAGE:-ghcr.io/orlv-85/ai-parser:latest}
    container_name: ai-news-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AINEWS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ainews}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-ainews}
      AINEWS_SOURCES_PATH: /app/sources.yaml
      AINEWS_REQUEST_TIMEOUT_SECONDS: ${AINEWS_REQUEST_TIMEOUT_SECONDS:-15}
      AINEWS_MAX_RETRIES: ${AINEWS_MAX_RETRIES:-3}
      AINEWS_PER_SOURCE_MIN_INTERVAL_SECONDS: ${AINEWS_PER_SOURCE_MIN_INTERVAL_SECONDS:-1.0}
      AINEWS_RESPECT_ROBOTS_TXT: ${AINEWS_RESPECT_ROBOTS_TXT:-true}
      AINEWS_AUTH_ENABLED: ${AINEWS_AUTH_ENABLED:-false}
      AINEWS_AUTH_USERNAME: ${AINEWS_AUTH_USERNAME:-}
      AINEWS_AUTH_PASSWORD_HASH: ${AINEWS_AUTH_PASSWORD_HASH:-}
      AINEWS_AUTH_SECRET: ${AINEWS_AUTH_SECRET:-}
      AINEWS_AUTH_SESSION_TTL_SECONDS: ${AINEWS_AUTH_SESSION_TTL_SECONDS:-3600}
      AINEWS_AUTH_COOKIE_SECURE: ${AINEWS_AUTH_COOKIE_SECURE:-true}
      AINEWS_MCP_AUTH_ENABLED: ${AINEWS_MCP_AUTH_ENABLED:-false}
      AINEWS_MCP_AUTH_TOKEN: ${AINEWS_MCP_AUTH_TOKEN:-}
    expose:
      - "8010"
    volumes:
      - ./data:/app/data
      - ./sources.yaml:/app/sources.yaml:ro

  antigravity:
    image: ${ANTIGRAVITY_IMAGE:-lbjlaq/antigravity-manager:latest}
    container_name: ai-news-antigravity
    restart: unless-stopped
    environment:
      API_KEY: ${ANTIGRAVITY_API_KEY:-change_me}
      WEB_PASSWORD: ${ANTIGRAVITY_WEB_PASSWORD:-change_me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ACCOUNT_EMAIL: ${ANTIGRAVITY_ACCOUNT_EMAIL:-}
      ACCOUNT_PASSWORD: ${ANTIGRAVITY_ACCOUNT_PASSWORD:-}
    ports:
      - "127.0.0.1:${ANTIGRAVITY_PORT:-8045}:8045"
    volumes:
      - ./data/antigravity:/root/.antigravity_tools

  caddy:
    image: caddy:2-alpine
    container_name: ai-news-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
