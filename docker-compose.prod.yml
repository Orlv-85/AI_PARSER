services:
  db:
    image: postgres:18-alpine
    container_name: ai-news-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ainews}
      POSTGRES_USER: ${POSTGRES_USER:-ainews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: build/Dockerfile
      target: runtime
    container_name: ai-news-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AINEWS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ainews}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-ainews}
      AINEWS_SOURCES_PATH: /app/sources.yaml
      AINEWS_REQUEST_TIMEOUT_SECONDS: ${AINEWS_REQUEST_TIMEOUT_SECONDS:-15}
      AINEWS_MAX_RETRIES: ${AINEWS_MAX_RETRIES:-3}
      AINEWS_PER_SOURCE_MIN_INTERVAL_SECONDS: ${AINEWS_PER_SOURCE_MIN_INTERVAL_SECONDS:-1.0}
      AINEWS_RESPECT_ROBOTS_TXT: ${AINEWS_RESPECT_ROBOTS_TXT:-true}
    ports:
      - "${WEB_PORT:-8010}:8010"
    volumes:
      - ./data:/app/data
      - ./sources.yaml:/app/sources.yaml:ro

volumes:
  pgdata:
