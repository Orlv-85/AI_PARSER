services:
  db:
    image: postgres:18-alpine
    container_name: ai-news-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ainews}
      POSTGRES_USER: ${POSTGRES_USER:-ainews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: ${APP_IMAGE:-ghcr.io/orlv-85/ai-parser:latest}
    container_name: ai-news-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AINEWS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ainews}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-ainews}
      AINEWS_SOURCES_PATH: /app/sources.yaml
      AINEWS_REQUEST_TIMEOUT_SECONDS: ${AINEWS_REQUEST_TIMEOUT_SECONDS:-15}
      AINEWS_MAX_RETRIES: ${AINEWS_MAX_RETRIES:-3}
      AINEWS_PER_SOURCE_MIN_INTERVAL_SECONDS: ${AINEWS_PER_SOURCE_MIN_INTERVAL_SECONDS:-1.0}
      AINEWS_RESPECT_ROBOTS_TXT: ${AINEWS_RESPECT_ROBOTS_TXT:-true}
      AINEWS_AUTH_ENABLED: ${AINEWS_AUTH_ENABLED:-false}
      AINEWS_AUTH_USERNAME: ${AINEWS_AUTH_USERNAME:-}
      AINEWS_AUTH_PASSWORD_HASH: ${AINEWS_AUTH_PASSWORD_HASH:-}
      AINEWS_AUTH_SECRET: ${AINEWS_AUTH_SECRET:-}
      AINEWS_AUTH_SESSION_TTL_SECONDS: ${AINEWS_AUTH_SESSION_TTL_SECONDS:-3600}
      AINEWS_AUTH_COOKIE_SECURE: ${AINEWS_AUTH_COOKIE_SECURE:-true}
      AINEWS_PUBLISH_API_TOKEN: ${AINEWS_PUBLISH_API_TOKEN:-}
      JEV_API_KEY: ${JEV_API_KEY:-}
      AINEWS_JEV_ENABLED: ${AINEWS_JEV_ENABLED:-true}
      AINEWS_JEV_MODEL: ${AINEWS_JEV_MODEL:-jev-1.13.0}
      AINEWS_JEV_TIMEOUT_SECONDS: ${AINEWS_JEV_TIMEOUT_SECONDS:-3}
      AINEWS_JEV_CATEGORY_MIN_CONFIDENCE: ${AINEWS_JEV_CATEGORY_MIN_CONFIDENCE:-0.7}
      AINEWS_SEMANTIC_ADMISSION_ENABLED: ${AINEWS_SEMANTIC_ADMISSION_ENABLED:-true}
      AINEWS_SEMANTIC_ADMISSION_POLICY_VERSION: ${AINEWS_SEMANTIC_ADMISSION_POLICY_VERSION:-semantic-admission-2026-10-10}
      AINEWS_DAILY_ENRICHMENT_ENABLED: "true"
      AINEWS_SEMANTIC_ADMISSION_PROMPT_VERSION: pilot-rubric-clarification-3
      DS_API_KEY: ${DS_API_KEY:-}
      AINEWS_SOURCE_REVIEW_DEEPSEEK_MODEL: ${AINEWS_SOURCE_REVIEW_DEEPSEEK_MODEL:-deepseek-flash}
      AINEWS_WEEKLY_V2_ENABLED: ${AINEWS_WEEKLY_V2_ENABLED:-false}
      AINEWS_DAILY_SIGNALS_ENABLED: ${AINEWS_DAILY_SIGNALS_ENABLED:-true}
    expose:
      - "8010"
    volumes:
      - ./data:/app/data
      - ./sources.yaml:/app/sources.yaml:ro

  caddy:
    image: caddy:2-alpine
    container_name: ai-news-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
