services:
  ai-news:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-news
    restart: unless-stopped
    environment:
      AINEWS_DATABASE_URL: sqlite:///./data/ai_news.db
      AINEWS_SOURCES_PATH: /app/sources.yaml
    ports:
      - "8010:8010"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./data:/app/data
      - ./sources.yaml:/app/sources.yaml:ro
