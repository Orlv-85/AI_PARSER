    fetch_interval_minutes: 720
    source_weight: 0.6

  - id: kdnuggets_rnn_tag
    name: KDnuggets — Recurrent Neural Networks tag
    type: rss
    url: https://www.kdnuggets.com/tag/recurrent-neural-networks/feed
