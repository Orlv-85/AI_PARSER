version: 1
defaults:
  language: en
  enabled: true
  fetch_interval_minutes: 60
  respect_robots: true
  source_weight: 1.0

sources:
  # --- Frontier labs / big tech AI blogs ---
  - id: openai_news
    name: OpenAI News (official RSS)
    type: rss
    url: https://openai.com/news/rss.xml
    fetch_interval_minutes: 30
    source_weight: 1.4

  - id: deepmind_blog
    name: Google DeepMind Blog
    type: rss
    url: https://deepmind.com/blog/feed/basic
    fetch_interval_minutes: 60
    source_weight: 1.3

  - id: aws_ai_blog
    name: AWS Machine Learning Blog
    type: rss
    url: https://aws.amazon.com/blogs/machine-learning/feed/
    fetch_interval_minutes: 60
    source_weight: 1.2

  - id: intel_ai_blog
    name: Intel AI Blog
    type: rss
    url: https://community.intel.com/t5/Blogs/Tech-Innovation/Artificial-Intelligence-AI/rss/board-id/Blogs-Artificial-Intelligence
    fetch_interval_minutes: 180
    source_weight: 1.1

  - id: microsoft_ai_blog
    name: Microsoft AI Blog
    type: rss
    url: https://blogs.microsoft.com/ai/feed/
    fetch_interval_minutes: 120
    source_weight: 1.2

  # Anthropic often has no official RSS; ingest as HTML
  - id: anthropic_news
    name: Anthropic Newsroom
    type: html
    url: https://www.anthropic.com/news
    fetch_interval_minutes: 60
    source_weight: 1.3
    parser_options:
      list_mode: generic
      article_mode: readability
      respect_robots: true

  # --- Hardware / infra with strong AI coverage ---
  - id: nvidia_press_room_rss
    name: NVIDIA Press Room (RSS)
    type: rss
    url: https://nvidianews.nvidia.com/rss
    fetch_interval_minutes: 60
    source_weight: 1.2

  - id: nvidia_blog_rss
    name: NVIDIA Blog (RSS)
    type: rss
    url: https://blogs.nvidia.com/feed/
    fetch_interval_minutes: 60
    source_weight: 1.2

  - id: nvidia_developer_blog_rss
    name: NVIDIA Developer Blog (RSS)
    type: rss
    url: https://developer.nvidia.com/blog/feed/
    fetch_interval_minutes: 120
    source_weight: 1.1

  # --- Top science / research-ish news streams ---
  - id: mit_ai_topic
    name: MIT News — Artificial Intelligence (topic RSS)
    type: rss
    url: https://news.mit.edu/rss/topic/artificial-intelligence2
    fetch_interval_minutes: 120
    source_weight: 1.2

  - id: distill
    name: Distill (ML articles)
    type: rss
    url: https://distill.pub/rss.xml
    fetch_interval_minutes: 720
    source_weight: 1.0

  - id: fastai
    name: fast.ai
    type: rss
    url: https://www.fast.ai/index.xml
    fetch_interval_minutes: 720
    source_weight: 1.0

  - id: bair
    name: Berkeley AI Research (BAIR) Blog
    type: rss
    url: http://bair.berkeley.edu/blog/feed.xml
    fetch_interval_minutes: 360
    source_weight: 1.1

  # --- Major tech/business outlets (filter by AI relevance in your scorer) ---
  - id: techcrunch_main
    name: TechCrunch (main feed)
    type: rss
    url: https://techcrunch.com/feed/
    fetch_interval_minutes: 30
    source_weight: 1.0

  - id: venturebeat_main
    name: VentureBeat (main feed)
    type: rss
    url: https://venturebeat.com/feed/
    fetch_interval_minutes: 30
    source_weight: 1.0

  - id: the_verge_main
    name: The Verge (main feed)
    type: rss
    url: https://www.theverge.com/rss/index.xml
    fetch_interval_minutes: 60
    source_weight: 0.9

  - id: ars_technica
    name: Ars Technica
    type: rss
    url: https://feeds.arstechnica.com/arstechnica/index/
    fetch_interval_minutes: 60
    source_weight: 0.9

  - id: wired
    name: WIRED
    type: rss
    url: https://www.wired.com/feed/rss
    fetch_interval_minutes: 120
    source_weight: 0.9

  # --- Curated AI/ML specific feeds (from awesome-AI-feeds) ---
  - id: machine_learning_mastery
    name: Machine Learning Mastery
    type: rss
    url: http://machinelearningmastery.com/blog/feed
    fetch_interval_minutes: 240
    source_weight: 0.9

  - id: ai_in_the_news_aitopics
    name: AITopics — AI in the News (FeedBurner)
    type: rss
    url: http://feeds.feedburner.com/AIInTheNews
    fetch_interval_minutes: 180
    source_weight: 0.9

  - id: machinelearnings_co
    name: Machine Learnings (newsletter/feed)
    type: rss
    url: https://machinelearnings.substack.com/feed
    fetch_interval_minutes: 240
    source_weight: 0.9

  - id: inbenta_blog
    name: Inbenta Resource Center
    type: html
    url: https://www.inbenta.com/
    fetch_interval_minutes: 360
    source_weight: 0.8
    html:
      link_selector: a[href^="/articles/"], a[href^="/ai-this-week/"]
      extraction_strategy: readability

  - id: clarifai_blog
    name: Clarifai Blog
    type: rss
    url: https://www.clarifai.com/blog/rss.xml
    fetch_interval_minutes: 360
    source_weight: 0.8

  - id: datarobot_blog
    name: DataRobot Blog
    type: rss
    url: https://www.datarobot.com/blog/feed
    fetch_interval_minutes: 360
    source_weight: 0.8

  - id: miri_blog
    name: Machine Intelligence Research Institute (MIRI)
    type: rss
    url: https://intelligence.org/blog/feed
    fetch_interval_minutes: 720
    source_weight: 0.9

  - id: iris_ai
    name: Iris.ai Blog
    type: rss
    url: https://iris.ai/feed
    fetch_interval_minutes: 720
    source_weight: 0.7

  - id: datumbox
    name: DatumBox (ML/Stats/Software)
    type: rss
    url: http://blog.datumbox.com/feed
    fetch_interval_minutes: 720
    source_weight: 0.7

  - id: aiweekly
    name: AI Weekly (issues RSS)
    type: rss
    url: http://aiweekly.co/issues.rss
    fetch_interval_minutes: 240
    source_weight: 0.8

  - id: aiweirdness
    name: AI Weirdness
    type: rss
    url: http://aiweirdness.com/rss
    fetch_interval_minutes: 720
    source_weight: 0.6

  - id: becominghuman
    name: Becoming Human (AI magazine)
    type: rss
