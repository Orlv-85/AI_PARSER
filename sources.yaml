    fetch_interval_minutes: 720
    source_weight: 0.6
    html:
      link_selector: a[href*="/blog/"]:not([href="/blog/"])
      extraction_strategy: readability

  - id: meaningcloud
    name: MeaningCloud Blog (fallback)
