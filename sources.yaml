    source_weight: 0.6

  - id: paperspace_blog
    name: Paperspace Blog
    type: rss
    url: https://blog.paperspace.com/feed
    fetch_interval_minutes: 360
    source_weight: 0.7

  - id: wildml
    name: WildML
    type: rss
    url: https://dennybritz.com/index.xml
    fetch_interval_minutes: 720
    source_weight: 0.8

  - id: machinethink
    name: Machine, Think!
    type: rss
    url: http://machinethink.net/blog/index.xml
    fetch_interval_minutes: 720
    source_weight: 0.7

  - id: marketing_ai_institute
    name: Marketing AI Institute
    type: rss
    url: http://www.marketingaiinstitute.com/blog/rss.xml
    fetch_interval_minutes: 360
    source_weight: 0.6

  - id: yseop
    name: Yseop Blog
    type: rss
    url: https://yseop.com/feed
    fetch_interval_minutes: 720
    source_weight: 0.6

  - id: rainbird
    name: Rainbird AI Blog
    type: rss
    url: http://rainbird.ai/blog/feed
    fetch_interval_minutes: 720
    source_weight: 0.6

  - id: brighterion
    name: Brighterion Blog (FICO fallback)
