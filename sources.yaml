    source_weight: 0.6

  - id: lexalytics
    name: Lexalytics Blog
    type: rss
    url: https://www.lexalytics.com/lexablog/feed
    fetch_interval_minutes: 720
    source_weight: 0.6

  - id: bitext
    name: Bitext Blog
