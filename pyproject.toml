[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-news-collector"
version = "0.1.0"
description = "Spec-driven AI news collector MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0",
  "fastapi>=0.116.0",
  "feedparser>=6.0.11",
  "httpx>=0.28.1",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "psycopg[binary]>=3.2.0",
  "pyyaml>=6.0.2",
  "readability-lxml>=0.8.4.1",
  "sqlalchemy>=2.0.44",
  "trafilatura>=2.0.0",
  "typer>=0.16.1",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.10.0",
  "mypy>=1.18.0",
  "pylint>=3.3.0",
  "pytest>=8.4.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.12.0",
  "types-PyYAML>=6.0.12.20250915",
]

[project.scripts]
ai-news = "app.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"app.web" = ["index.html"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src/app"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
files = ["src", "tests"]

[tool.pylint.main]
py-version = "3.12"
jobs = 1
ignore-paths = ["^src/app/storage/migrations/"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "too-few-public-methods",
  "duplicate-code",
  "trailing-newlines",
  "line-too-long",
  "too-many-locals",
  "broad-exception-caught",
  "logging-too-many-args",
  "invalid-name",
  "too-many-arguments",
]
